name: Build Android APKs & Automated Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Keystores for Build
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload Key,O=Android,C=US"
          fi
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          cp -f my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Build and Sign Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Determine Version Tag & Release Notes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: release_info
        run: |
          # Calculate semantic version 1.0.X based on run number
          VERSION_TAG="v1.0.${{ github.run_number }}"
          echo "tag_name=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "release_name=ArtHax Release ${VERSION_TAG}" >> $GITHUB_OUTPUT

          # Prepare release description with commit history
          cat << 'EOF' > release_notes.md
          ## 🚀 ArtHax Android Release

          ### 📦 Version Info
          - **Tag**: `${VERSION_TAG}`
          - **Package**: `com.ms.arthax`
          - **Build**: Run #${{ github.run_number }}

          ### 📝 Changes in this Update:
          EOF

          # Append git commits since last tag or last 10 commits
          echo "" >> release_notes.md
          git log -n 10 --pretty=format:"- %s (%h)" >> release_notes.md || echo "- Routine update and stability improvements" >> release_notes.md
          echo "" >> release_notes.md

          cat << 'EOF' >> release_notes.md

          ### ✨ Included Features:
          - **Minimalist Puter.js Auth**: In-app minimalist webview authentication with real-time login event listeners.
          - **Live Model Fetching**: Dynamically queries and refreshes the live list of AI models directly from the Puter API.
          - **Unrestricted Mode**: Prompt filter bypass for 2D game devs, horror artwork, monsters, and combat effects.
          - **Smart Copyright Bypass**: Automatic stylistic prompt conversion to avoid trademark flags while retaining art intent.
          - **Draggable Overlay Bubble**: Edge-hugging floating trigger for canvas cropping and AI drawing inside paint apps.

          ### 📥 Download
          - `app-release.apk` (Signed Release APK)
          - `app-debug.apk` (Debug APK)
          EOF

      - name: Create GitHub Release & Upload APKs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
