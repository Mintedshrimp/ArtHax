name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RAW_KEYSTORE: ${{ secrets.KEYSTORE || secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE || secrets.RELEASE_KEYSTORE || secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEY_PASSWORD || 'android' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.RELEASE_KEYSTORE_ALIAS || 'upload' }}
      KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS || secrets.RELEASE_KEYSTORE_ALIAS || 'upload' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Automated Version Bump
        id: version_bump
        run: |
          # Fetch all remote tags
          git fetch --tags --force || true
          
          # If triggered by a tag push, use that tag directly
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CURRENT_TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $CURRENT_TAG"
            echo "tag_name=$CURRENT_TAG" >> $GITHUB_OUTPUT
            echo "version_name=${CURRENT_TAG#v}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Find highest existing semver tag
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag -l | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
            if [ -n "$LATEST_TAG" ]; then
              LATEST_TAG="v$LATEST_TAG"
            fi
          fi
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
            echo "No existing tag found, defaulting to base: $LATEST_TAG"
          else
            echo "Latest found tag: $LATEST_TAG"
          fi
          
          # Strip 'v' prefix for arithmetic
          RAW_VER="${LATEST_TAG#v}"
          IFS='.' read -r -a PARTS <<< "$RAW_VER"
          
          MAJOR=${PARTS[0]:-1}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          
          echo "Current parsed: Major=$MAJOR, Minor=$MINOR, Patch=$PATCH"
          
          if [ "$PATCH" -ge 9 ] && [ "$MINOR" -ge 9 ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
          elif [ "$PATCH" -ge 9 ]; then
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
          fi
          
          NEXT_TAG="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "Calculated next bumped version: $NEXT_TAG"
          
          echo "tag_name=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "version_name=${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}" >> $GITHUB_OUTPUT

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystores
        id: prep_keystore
        run: |
          mkdir -p app
          # 1. Restore debug.keystore if present
          if [ -f "debug.keystore.base64" ]; then
            cat debug.keystore.base64 | tr -d '\r\n ' | base64 -d > debug.keystore
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>&1 || true
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

          FINAL_KS_PATH="my-upload-key.jks"
          FINAL_KS_PASS="${KEYSTORE_PASSWORD:-android}"
          FINAL_KEY_ALIAS="${KEY_ALIAS:-upload}"
          FINAL_KEY_PASS="${KEY_PASSWORD:-android}"

          # 2. Extract and decode organization / repo secret keystore
          if [ -n "$RAW_KEYSTORE" ]; then
            echo "Decoding release keystore from organization/repository secret..."
            echo "$RAW_KEYSTORE" | tr -d '\r\n ' | base64 -d > app/my-upload-key.jks
            if [ -s "app/my-upload-key.jks" ]; then
              cp app/my-upload-key.jks my-upload-key.jks 2>/dev/null || true
              
              # Try to verify alias or auto-detect if specified alias doesn't exist
              DETECTED_ALIAS=$(keytool -list -v -keystore app/my-upload-key.jks -storepass "$FINAL_KS_PASS" 2>/dev/null | grep 'Alias name:' | head -n 1 | awk -F': ' '{print $2}' | tr -d '\r\n ' || true)
              if [ -n "$DETECTED_ALIAS" ]; then
                echo "🔑 Detected keystore alias: $DETECTED_ALIAS"
                FINAL_KEY_ALIAS="$DETECTED_ALIAS"
              fi

              echo "has_release_keystore=true" >> $GITHUB_OUTPUT
              echo "✅ Organization/repository release keystore prepared successfully."
            else
              echo "⚠️ Keystore base64 decoding resulted in an empty file. Falling back to debug keystore."
              cp debug.keystore app/my-upload-key.jks
              cp debug.keystore my-upload-key.jks 2>/dev/null || true
              FINAL_KS_PASS="android"
              FINAL_KEY_ALIAS="androiddebugkey"
              FINAL_KEY_PASS="android"
              echo "has_release_keystore=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️ No custom release keystore secret received. Using debug keystore for signed artifact generation."
            cp debug.keystore app/my-upload-key.jks
            cp debug.keystore my-upload-key.jks 2>/dev/null || true
            FINAL_KS_PASS="android"
            FINAL_KEY_ALIAS="androiddebugkey"
            FINAL_KEY_PASS="android"
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi

          echo "KEYSTORE_PATH=$FINAL_KS_PATH" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$FINAL_KS_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$FINAL_KEY_ALIAS" >> $GITHUB_ENV
          echo "KEYSTORE_ALIAS=$FINAL_KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$FINAL_KEY_PASS" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEYSTORE_ALIAS: ${{ env.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Verify APK Signatures & Prepare Release Artifacts
        run: |
          echo "Inspecting generated APK files..."
          ls -la app/build/outputs/apk/release/ || true

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "❌ CRITICAL: assembleRelease did not produce any APK!"
            exit 1
          fi

          echo "Target APK to verify: $RELEASE_APK"

          # Verify signature using apksigner or jarsigner
          APKSIGNER_BIN=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="apksigner"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
            APKSIGNER_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          fi

          if [ -n "$APKSIGNER_BIN" ]; then
            echo "Verifying signature via $APKSIGNER_BIN..."
            "$APKSIGNER_BIN" verify --verbose "$RELEASE_APK" || {
              echo "❌ APK signature verification failed!"
              exit 1
            }
          else
            echo "Verifying signature via jarsigner..."
            jarsigner -verify -verbose -certs "$RELEASE_APK" || {
              echo "❌ Jarsigner signature verification failed!"
              exit 1
            }
          fi

          echo "✅ APK signature verified successfully!"

          # Copy to standardized filenames for release attachment
          TAG_NAME="${{ steps.version_bump.outputs.tag_name }}"
          cp "$RELEASE_APK" "app/build/outputs/apk/release/ArtHax-${TAG_NAME}.apk"
          cp "$RELEASE_APK" "app/build/outputs/apk/release/app-release.apk"

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArtHax-APK-${{ steps.version_bump.outputs.tag_name }}
          path: |
            app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release & Upload APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ steps.version_bump.outputs.tag_name }}"
          files: |
            app/build/outputs/apk/release/ArtHax-*.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
