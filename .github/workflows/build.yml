name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Automated Version Bump
        id: version_bump
        run: |
          # Fetch all remote tags
          git fetch --tags --force || true
          
          # If triggered by a tag push, use that tag directly
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CURRENT_TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $CURRENT_TAG"
            echo "tag_name=$CURRENT_TAG" >> $GITHUB_OUTPUT
            echo "version_name=${CURRENT_TAG#v}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Find highest existing semver tag
          LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag -l | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
            if [ -n "$LATEST_TAG" ]; then
              LATEST_TAG="v$LATEST_TAG"
            fi
          fi
          
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
            echo "No existing tag found, defaulting to base: $LATEST_TAG"
          else
            echo "Latest found tag: $LATEST_TAG"
          fi
          
          # Strip 'v' prefix for arithmetic
          RAW_VER="${LATEST_TAG#v}"
          IFS='.' read -r -a PARTS <<< "$RAW_VER"
          
          MAJOR=${PARTS[0]:-1}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          
          echo "Current parsed: Major=$MAJOR, Minor=$MINOR, Patch=$PATCH"
          
          # Rollover logic:
          # if x.9.9 -> (x+1).0.0
          # else if x.x.9 -> x.(x+1).0
          # else -> x.x.(x+1)
          if [ "$PATCH" -ge 9 ] && [ "$MINOR" -ge 9 ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
          elif [ "$PATCH" -ge 9 ]; then
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
          fi
          
          NEXT_TAG="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "Calculated next bumped version: $NEXT_TAG"
          
          echo "tag_name=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "version_name=${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}" >> $GITHUB_OUTPUT

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (Release / Assemble)
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Sign APK (if Keystore Secret is configured)
        id: sign_app
        if: env.HAS_KEYSTORE == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

      - name: Tag Git Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.version_bump.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || true
          git push origin "$TAG" || true

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArtHax-APK-${{ steps.version_bump.outputs.tag_name }}
          path: |
            app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release & Upload APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_bump.outputs.tag_name }}
          name: "Release ${{ steps.version_bump.outputs.tag_name }}"
          files: |
            app/build/outputs/apk/release/*-signed.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
